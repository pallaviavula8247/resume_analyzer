services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - media_data:/app/backend/media
      - static_data:/app/backend/staticfiles
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: resume_analyzer
      POSTGRES_USER: resume_user
      POSTGRES_PASSWORD: resume_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  media_data:
  static_data:
